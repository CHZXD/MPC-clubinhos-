<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Painel - CRUD Células</title>
    <style>
        body { font-family: Arial, sans-serif; padding: 20px; background-color: #f4f4f4; }
        .form-container { background: white; padding: 20px; border-radius: 8px; max-width: 520px; margin: 0 auto; box-shadow: 0 0 10px rgba(0,0,0,0.1); }
        label { display: block; margin-top: 15px; font-weight: bold; font-size: 14px; color: #333; }
        input, select { width: 100%; padding: 8px; margin-top: 5px; border: 1px solid #ccc; border-radius: 4px; box-sizing: border-box; }
        button { margin-top: 16px; width: 100%; padding: 10px; border: none; border-radius: 4px; font-size: 16px; cursor: pointer; font-weight: bold; }
        .btn-save { background-color: #007bff; color: white; }
        .btn-save:hover { background-color: #0056b3; }
        .btn-delete { background-color: #dc3545; color: white; }
        .btn-delete:hover { filter: brightness(0.95); }

        #campos-novo {
            display: none;
            background-color: #e9ecef;
            padding: 15px;
            border-radius: 6px;
            margin-top: 15px;
            border: 1px dashed #6c757d;
        }
        #campos-novo label { margin-top: 10px; color: #0056b3; }
        .hint { font-size: 13px; color: #333; margin-top: 6px; }
        .row-actions { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
    </style>
</head>
<body>

<div class="form-container">
    <a href="index.html" style="text-decoration: none; color: #007bff; font-weight: bold;">
        ⬅️ Voltar para o Mapa
    </a>

    <h2 style="margin-top: 10px;">CRUD de Clubinhos</h2>

    <div class="hint">
        • <b>Modificar</b>: selecione a célula (id do banco) e clique em <i>Salvar</i><br>
        • <b>Excluir</b>: selecione a célula (id do banco) e clique em <i>Excluir</i>
    </div>

    <hr style="border:none;border-top:1px solid #ddd; margin:16px 0;" />

    <label>Selecione a Célula (id do banco):</label>
    <select id="celula-id" required>
        <option value="novo" style="font-weight: bold; color: blue;">➕ CADASTRAR NOVO CLUBINHO</option>
    </select>

    <div class="row-actions">
        <button id="btn-excluir" type="button" class="btn-delete">Excluir selecionado</button>
        <button type="submit" class="btn-save" form="form-celula" style="margin-top: 16px;">Salvar no Banco de Dados</button>
    </div>

    <form id="form-celula">
        <div id="campos-novo">
            <label>Nome do Novo Clubinho:</label>
            <input type="text" id="novo-nome" placeholder="Ex: Clubinho Taguatinga" />

            <label>Endereço / Referência:</label>
            <input type="text" id="novo-endereco" placeholder="Ex: QNB 12, Casa 5" />

            <label>Latitude (Lat):</label>
            <input type="text" id="novo-lat" placeholder="Ex: -15.8339" />

            <label>Longitude (Lon):</label>
            <input type="text" id="novo-lon" placeholder="Ex: -47.9391" />

            <label>Status Inicial:</label>
            <select id="novo-status">
                <option value="ATIVO">ATIVO</option>
                <option value="ACOMPANHADO">ACOMPANHADO</option>
                <option value="SEM INFORMAÇÕES">SEM INFORMAÇÕES</option>
                <option value="DESATIVADO">DESATIVADO</option>
            </select>

            <div style="font-size: 13px; color:#333; margin-top: 10px;">
                Atenção: para excluir/modificar clubinhos existentes, selecione a célula pelo <b>id do banco</b>.
            </div>
        </div>

        <label>Telefone (WhatsApp):</label>
        <input type="tel" id="telefone" placeholder="(61) 90000-0000" required />

        <label>Instagram:</label>
        <input type="text" id="instagram" placeholder="@seu.clubinho" required />

        <label>Dia de Funcionamento:</label>
        <select id="dia" required>
            <option value="" disabled selected>Selecione um dia</option>
            <option value="Segunda-feira">Segunda-feira</option>
            <option value="Terça-feira">Terça-feira</option>
            <option value="Quarta-feira">Quarta-feira</option>
            <option value="Quinta-feira">Quinta-feira</option>
            <option value="Sexta-feira">Sexta-feira</option>
            <option value="Sábado">Sábado</option>
            <option value="Domingo">Domingo</option>
        </select>

        <label>Horário de Início:</label>
        <input type="time" id="horario" required />
    </form>
</div>

<script>
    const API_BASE = 'https://mapa-celulas-v2.onrender.com/api/celulas';

    // Usado apenas para facilitar edição dos IDs fixos antigos (1..6)
    // No CRUD real, o correto é editar os dados do banco após carregar o select.
    const dadosBase = {
        "1": { nome: "FIRE", endereco: "704/904 Seps Eq 702/902", lat: -15.802449786329907, lon: -47.89940310012991, status: "ATIVO" },
        "2": { nome: "AVIVA CEMSO", endereco: "Mod D - Asa Sul", lat: -15.815634955806981, lon: -47.91962608473196, status: "ATIVO" },
        "3": { nome: "UNAI", endereco: "Colégio Militar de Brasília - 902/904 Asa Norte", lat: -15.779456881651777, lon: -47.89300, status: "ACOMPANHADO" },
        "4": { nome: "Andamento", endereco: "SPO, SHCS - Plano Piloto", lat: -15.833929894133584, lon: -47.9391698422606, status: "ACOMPANHADO" },
        "5": { nome: "NVC", endereco: "Plano Piloto (64MH+M4)", lat: -15.763914498737428, lon: -47.87207721349224, status: "ACOMPANHADO" },
        "6": { nome: "Vinde", endereco: "Ceilândia (5V4X+99)", lat: -15.843889802538921, lon: -48.1016329911501, status: "ATIVO" }
    };

    function atualizarCamposNovo() {
        const caixaNovo = document.getElementById('campos-novo');
        const isNovo = document.getElementById('celula-id').value === 'novo';
        caixaNovo.style.display = isNovo ? 'block' : 'none';

        document.getElementById('novo-nome').required = isNovo;
        document.getElementById('novo-lat').required = isNovo;
        document.getElementById('novo-lon').required = isNovo;
        document.getElementById('novo-endereco').required = isNovo;
    }

    async function carregarCelulasNoSelect() {
        const select = document.getElementById('celula-id');
        const valorAtual = select.value;

        const resposta = await fetch(API_BASE);
        const celulas = await resposta.json();

        // Limpa opções mantendo a de “novo”
        select.innerHTML = '<option value="novo" style="font-weight: bold; color: blue;">➕ CADASTRAR NOVO CLUBINHO</option>';

        celulas.forEach(c => {
            const opt = document.createElement('option');
            opt.value = String(c.id);
            const nome = c.nome ? c.nome : 'Sem nome';
            opt.textContent = `${c.id} - ${nome}`;
            select.appendChild(opt);
        });

        // tenta manter seleção se existir
        const existe = Array.from(select.options).some(o => o.value === valorAtual);
        if (existe) select.value = valorAtual;

        atualizarCamposNovo();
        await carregarDadosSelecionadosNoForm();
    }

    async function carregarDadosSelecionadosNoForm() {
        const idSelecionado = document.getElementById('celula-id').value;
        if (idSelecionado === 'novo') return;

        try {
            const resposta = await fetch(`${API_BASE}/${idSelecionado}`);
            if (!resposta.ok) return;
            const c = await resposta.json();

            document.getElementById('telefone').value = c.telefone || '';
            document.getElementById('instagram').value = c.instagram || '';
            document.getElementById('dia').value = c.diaFuncionamento || '';
            document.getElementById('horario').value = c.horario || '';
        } catch (e) {
            // fallback: nada
        }
    }

    async function excluirSelecionado() {
        const idSelecionado = document.getElementById('celula-id').value;
        if (idSelecionado === 'novo') {
            alert('Selecione uma célula existente para excluir.');
            return;
        }

        const ok = confirm(`Excluir a célula id ${idSelecionado}?`);
        if (!ok) return;

        try {
            const resp = await fetch(`${API_BASE}/${idSelecionado}`, { method: 'DELETE' });
            if (!resp.ok) {
                const text = await resp.text().catch(() => '');
                alert(`Erro ao excluir. ${text}`.trim());
                return;
            }

            alert('✅ Exclusão realizada!');
            document.getElementById('form-celula').reset();
            document.getElementById('celula-id').value = 'novo';
            atualizarCamposNovo();
            await carregarCelulasNoSelect();
        } catch (err) {
            alert('🔌 Erro de conexão ao excluir.');
        }
    }

    // Init
    document.getElementById('celula-id').addEventListener('change', async () => {
        atualizarCamposNovo();
        await carregarDadosSelecionadosNoForm();
    });

    document.getElementById('btn-excluir').addEventListener('click', excluirSelecionado);

    document.getElementById('form-celula').addEventListener('submit', async function(e) {
        e.preventDefault();

        const idSelecionado = document.getElementById('celula-id').value;

        let payload = null;
        let metodo = 'POST';
        let url = API_BASE;

        if (idSelecionado === 'novo') {
            const lat = parseFloat(document.getElementById('novo-lat').value.replace(',', '.'));
            const lon = parseFloat(document.getElementById('novo-lon').value.replace(',', '.'));

            if (Number.isNaN(lat) || Number.isNaN(lon)) {
                alert('Por favor, informe latitude e longitude válidas.');
                return;
            }

            payload = {
                nome: document.getElementById('novo-nome').value,
                endereco: document.getElementById('novo-endereco').value,
                lat,
                lon,
                status: document.getElementById('novo-status').value,
                telefone: document.getElementById('telefone').value,
                instagram: document.getElementById('instagram').value,
                diaFuncionamento: document.getElementById('dia').value,
                horario: document.getElementById('horario').value
            };
        } else {
            // Para PUT, usamos dados do banco quando carregado pelo select.
            // Como o frontend não guarda todos os campos do registro, mantemos o básico
            // via dadosBase apenas para 1..6 (se não existir, usa fallback do formulário).
            // O endpoint PUT salva tudo que enviamos.
            const infoBase = dadosBase[idSelecionado] || {
                nome: '',
                endereco: '',
                lat: null,
                lon: null,
                status: 'SEM INFORMAÇÕES'
            };

            payload = {
                nome: infoBase.nome,
                endereco: infoBase.endereco,
                lat: infoBase.lat,
                lon: infoBase.lon,
                status: infoBase.status,
                telefone: document.getElementById('telefone').value,
                instagram: document.getElementById('instagram').value,
                diaFuncionamento: document.getElementById('dia').value,
                horario: document.getElementById('horario').value
            };

            metodo = 'PUT';
            url = `${API_BASE}/${idSelecionado}`;
        }

        try {
            const resposta = await fetch(url, {
                method: metodo,
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(payload)
            });

            if (resposta.ok) {
                alert('✅ Salvo com sucesso!');
                document.getElementById('form-celula').reset();
                document.getElementById('campos-novo').style.display = 'none';
                await carregarCelulasNoSelect();
            } else {
                const text = await resposta.text().catch(() => '');
                alert(`❌ Erro ao salvar. ${text}`.trim());
            }
        } catch (erro) {
            console.error(erro);
            alert('🔌 Erro de conexão!');
        }
    });

    window.addEventListener('DOMContentLoaded', async () => {
        atualizarCamposNovo();
        await carregarCelulasNoSelect();
    });
</script>
</body>
</html>
